services:
  auth-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - auth_db:/var/lib/postgresql/data
      - ./auth-service-main/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d auth_db
      interval: 5s
      timeout: 5s
      retries: 20

  flag-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: flags_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - flag_db:/var/lib/postgresql/data
      - ./flag-service-main/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d flags_db
      interval: 5s
      timeout: 5s
      retries: 20

  targeting-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: targeting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - targeting_db:/var/lib/postgresql/data
      - ./targeting-service-main/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d targeting_db
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20

  dynamodb:
    image: amazon/dynamodb-local:latest
    restart: unless-stopped
    command:
      - "-jar"
      - DynamoDBLocal.jar
      - "-sharedDb"
      - "-inMemory"
    ports:
      - "8000:8000"

  localstack:
    image: localstack/localstack:3.8
    restart: unless-stopped
    environment:
      SERVICES: "sqs"
      AWS_DEFAULT_REGION: "us-east-1"
      DEBUG: "0"
      SQS_ENDPOINT_STRATEGY: "path"
    ports:
      - "4566:4566"
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:4566/_localstack/health | grep -q 'sqs'
      interval: 5s
      timeout: 5s
      retries: 30

  sqs-init:
    image: amazon/aws-cli:2.17.60
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command:
      - --endpoint-url=http://localstack:4566
      - sqs
      - create-queue
      - --queue-name
      - toggle-master

  dynamodb-init:
    image: amazon/aws-cli:2.17.60
    depends_on:
      dynamodb:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command:
      - dynamodb
      - create-table
      - --table-name
      - ToggleMasterAnalytics
      - --attribute-definitions
      - AttributeName=event_id,AttributeType=S
      - --key-schema
      - AttributeName=event_id,KeyType=HASH
      - --billing-mode
      - PAY_PER_REQUEST
      - --endpoint-url
      - http://dynamodb:8000

  auth-service:
    build:
      context: ./auth-service-main
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      DATABASE_URL: postgres://postgres:postgres@auth-db:5432/auth_db?sslmode=disable
      MASTER_KEY: toggle-master-dev-only

  flag-service:
    build:
      context: ./flag-service-main
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      flag-db:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
      DATABASE_URL: postgres://postgres:postgres@flag-db:5432/flags_db?sslmode=disable
      AUTH_SERVICE_URL: http://auth-service:8001

  targeting-service:
    build:
      context: ./targeting-service-main
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      targeting-db:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      PORT: "8003"
      DATABASE_URL: postgres://postgres:postgres@targeting-db:5432/targeting_db?sslmode=disable
      AUTH_SERVICE_URL: http://auth-service:8001

  evaluation-service:
    build:
      context: ./evaluation-service-main
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      flag-service:
        condition: service_started
      targeting-service:
        condition: service_started
      sqs-init:
        condition: service_completed_successfully
    ports:
      - "8004:8004"
    environment:
      PORT: "8004"
      REDIS_URL: redis://redis:6379
      FLAG_SERVICE_URL: http://flag-service:8002
      TARGETING_SERVICE_URL: http://targeting-service:8003

      # API key usada pelo Evaluation para acessar
      # Flag Service e Targeting Service
      SERVICE_API_KEY: ${SERVICE_API_KEY:-SUA_API_KEY}

      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      # URL da fila
      AWS_SQS_URL: http://localstack:4566/000000000000/toggle-master

      # Endpoint do LocalStack para desenvolvimento local
      SQS_ENDPOINT: http://localstack:4566

  analytics-service:
    build:
      context: ./analytics-service-main
    restart: unless-stopped
    depends_on:
      dynamodb:
        condition: service_started
      sqs-init:
        condition: service_completed_successfully
    ports:
      - "8005:8005"
    environment:
      PORT: "8005"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      AWS_SQS_URL: http://localstack:4566/000000000000/toggle-master
      AWS_DYNAMODB_TABLE: ToggleMasterAnalytics

      DYNAMODB_ENDPOINT: http://dynamodb:8000
      SQS_ENDPOINT: http://localstack:4566

volumes:
  auth_db:
  flag_db:
  targeting_db:
