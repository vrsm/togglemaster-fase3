name: auth-service
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'auth-service-main/**'
      - '.github/workflows/auth-service.yml'
  push:
    branches: [main]
    paths:
      - 'auth-service-main/**'
      - '.github/workflows/auth-service.yml'
permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY || 'local' }}

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service-main
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      if: ${{ hashFiles('auth-service-main/go.mod') != '' }}
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Setup Python
      if: ${{ hashFiles('auth-service-main/requirements.txt') != '' }}
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      if: ${{ hashFiles('auth-service-main/requirements.txt') != '' }}
      run: pip install -r requirements.txt bandit flake8 pytest

    - name: Download Go modules
      if: ${{ hashFiles('*/go.mod') != '' }}
      run: go mod download

    - name: Unit tests - Go
      if: ${{ hashFiles('auth-service-main/go.mod') != '' }}
      run: go test ./...

    - name: Lint - Go
      if: ${{ hashFiles('auth-service-main/go.mod') != '' }}
      uses: golangci/golangci-lint-action@v7
      with:
        working-directory: auth-service-main

    - name: SAST - gosec
      if: ${{ hashFiles('auth-service-main/go.mod') != '' }}
      uses: securego/gosec@master
      with:
        args: './...'

    - name: Unit tests - Python
      if: ${{ hashFiles('auth-service-main/requirements.txt') != '' }}
      run: python -m pytest || test $? -eq 5

    - name: Lint - Python
      if: ${{ hashFiles('auth-service-main/requirements.txt') != '' }}
      run: flake8 .

    - name: SAST - Bandit
      if: ${{ hashFiles('auth-service-main/requirements.txt') != '' }}
      run: bandit -r . -ll

    - name: SCA - Trivy filesystem
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: auth-service-main
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: '1'

    - name: Docker build
      run: docker build -t ${{ env.ECR_REGISTRY }}/auth-service:${{ github.sha }} .

    - name: Container scan - Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.ECR_REGISTRY }}/auth-service:${{ github.sha }}
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: '1'

  publish-and-gitops:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: security-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          docker build \
            -t $ECR_REGISTRY/auth-service:${{ github.sha }} \
            auth-service-main

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          docker push \
            $ECR_REGISTRY/auth-service:${{ github.sha }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          persist-credentials: false

      - name: Update GitOps image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("gitops/apps/auth-service/deployment.yaml")
          text = path.read_text()

          image_tag = os.environ["IMAGE_TAG"]
          registry = os.environ["ECR_REGISTRY"]

          pattern = (
              r"(image:\s+"
              + re.escape(registry)
              + r"/auth-service:)[^\s]+"
          )

          replacement = rf"\g<1>{image_tag}"
          updated, count = re.subn(pattern, replacement, text)

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one auth-service image, found {count}"
              )

          path.write_text(updated)
          PY

      - name: Commit and push GitOps
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/auth-service/deployment.yaml

          git commit \
            -m "chore(auth-service): deploy ${IMAGE_TAG::7}" \
            || echo "No changes to commit"

          git remote set-url origin \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPOSITORY}.git"

          git push origin main
