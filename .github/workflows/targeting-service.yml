name: targeting-service

on:
  pull_request:
    paths:
      - 'targeting-service-main/**'
      - '.github/workflows/targeting-service.yml'
  push:
    branches:
      - main
    paths:
      - 'targeting-service-main/**'
      - '.github/workflows/targeting-service.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: targeting-service-main
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 bandit

      - name: Unit tests - Python
        working-directory: targeting-service-main
        run: |
          python -m pytest || test $? -eq 5

      - name: Lint - Python
        working-directory: targeting-service-main
        run: |
          flake8 .

      - name: SAST - Bandit
        working-directory: targeting-service-main
        run: |
          bandit -r . -ll

      - name: SCA - Trivy filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: targeting-service-main
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Docker build
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          docker build \
            -t $ECR_REGISTRY/targeting-service:${{ github.sha }} \
            targeting-service-main

      - name: Container scan - Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ECR_REGISTRY }}/targeting-service:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  publish-and-gitops:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: security-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          docker build \
            -t $ECR_REGISTRY/targeting-service:${{ github.sha }} \
            targeting-service-main

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          AWS_REGION: us-east-1
        run: |
          if aws ecr describe-images \
            --repository-name targeting-service \
            --image-ids imageTag="${{ github.sha }}" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Imagem $ECR_REGISTRY/targeting-service:${{ github.sha }} já existe no ECR."
            echo "ECR usa tags imutáveis; não será feito overwrite."
          else
            docker push \
              "$ECR_REGISTRY/targeting-service:${{ github.sha }}"
          fi

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          persist-credentials: false

      - name: Update GitOps image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("gitops/apps/targeting-service/deployment.yaml")
          text = path.read_text()

          image_tag = os.environ["IMAGE_TAG"]
          registry = os.environ["ECR_REGISTRY"]

          pattern = (
              r"(image:\s+"
              + re.escape(registry)
              + r"/targeting-service:)[^\s]+"
          )

          replacement = rf"\g<1>{image_tag}"
          updated, count = re.subn(pattern, replacement, text)

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one targeting-service image, found {count}"
              )

          path.write_text(updated)
          PY

      - name: Validate GitOps image
        working-directory: gitops
        run: |
          grep -n "image:" apps/targeting-service/deployment.yaml

          test "$(grep -c \
            "${ECR_REGISTRY}/targeting-service:${IMAGE_TAG}" \
            apps/targeting-service/deployment.yaml)" -eq 1
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

      - name: Commit and push GitOps
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/targeting-service/deployment.yaml

          git commit \
            -m "chore(targeting-service): deploy ${IMAGE_TAG::7}" \
            || echo "No changes to commit"

          git remote set-url origin \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPOSITORY}.git"

          git push origin main
