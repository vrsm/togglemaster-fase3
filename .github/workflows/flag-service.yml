name: flag-service
on:
  workflow_dispatch:
  pull_request:
    paths: ['flag-service-main/**']
  push:
    branches: [main]
    paths: ['flag-service-main/**']
permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY || 'local' }}

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flag-service-main
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      if: ${{ hashFiles('flag-service-main/go.mod') != '' }}
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Setup Python
      if: ${{ hashFiles('flag-service-main/requirements.txt') != '' }}
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      if: ${{ hashFiles('flag-service-main/requirements.txt') != '' }}
      run: pip install -r requirements.txt bandit flake8 pytest

    - name: Download Go modules
      if: ${{ hashFiles('*/go.mod') != '' }}
      run: go mod download

    - name: Unit tests - Go
      if: ${{ hashFiles('flag-service-main/go.mod') != '' }}
      run: go test ./...

    - name: Lint - Go
      if: ${{ hashFiles('flag-service-main/go.mod') != '' }}
      uses: golangci/golangci-lint-action@v7
      with:
        working-directory: flag-service-main

    - name: SAST - gosec
      if: ${{ hashFiles('flag-service-main/go.mod') != '' }}
      uses: securego/gosec@master
      with:
        args: './...'

    - name: Unit tests - Python
      if: ${{ hashFiles('flag-service-main/requirements.txt') != '' }}
      run: python -m pytest || test $? -eq 5

    - name: Lint - Python
      if: ${{ hashFiles('flag-service-main/requirements.txt') != '' }}
      run: flake8 .

    - name: SAST - Bandit
      if: ${{ hashFiles('flag-service-main/requirements.txt') != '' }}
      run: bandit -r . -ll

    - name: SCA - Trivy filesystem
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: flag-service-main
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: '1'

    - name: Docker build
      run: docker build -t ${{ env.ECR_REGISTRY }}/flag-service:${{ github.sha }} .

    - name: Container scan - Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.ECR_REGISTRY }}/flag-service:${{ github.sha }}
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: '1'

  publish-and-gitops:
    needs: security-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build and push
      run: |
        docker build -t $ECR_REGISTRY/flag-service:${{ github.sha }} flag-service-main
        docker push $ECR_REGISTRY/flag-service:${{ github.sha }}
    - name: Checkout GitOps
      uses: actions/checkout@v4
      with:
        repository: ${{ vars.GITOPS_REPOSITORY }}
        token: ${{ secrets.GITOPS_TOKEN }}
        path: gitops
    - name: Update image tag
      run: |
        python3 - <<'PY2'
        from pathlib import Path
        p=Path('gitops/apps/flag-service/deployment.yaml')
        s=p.read_text()
        import re
        s=re.sub(r'image:.*', 'image: '+str('${{ env.ECR_REGISTRY }}')+'/flag-service:'+str('${{ github.sha }}'), s)
        p.write_text(s)
        PY2
        cd gitops
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add apps/flag-service/deployment.yaml
        git commit -m 'chore(flag-service): deploy ${GITHUB_SHA::7}' || exit 0
        git push
