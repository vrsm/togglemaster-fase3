name: evaluation-service

on:
  workflow_dispatch:

  pull_request:
    paths:
      - 'evaluation-service-main/**'
      - '.github/workflows/evaluation-service.yml'

  push:
    branches: [main]
    paths:
      - 'evaluation-service-main/**'
      - '.github/workflows/evaluation-service.yml'

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY || 'local' }}

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: evaluation-service-main

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        if: ${{ hashFiles('evaluation-service-main/go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download Go modules
        if: ${{ hashFiles('evaluation-service-main/go.mod') != '' }}
        run: go mod download

      - name: Unit tests - Go
        if: ${{ hashFiles('evaluation-service-main/go.mod') != '' }}
        run: go test ./...

      - name: Lint - Go
        if: ${{ hashFiles('evaluation-service-main/go.mod') != '' }}
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: evaluation-service-main
          install-mode: binary

      - name: SAST - gosec
        if: ${{ hashFiles('evaluation-service-main/go.mod') != '' }}
        uses: securego/gosec@master
        with:
          args: ./...

      - name: SCA - Trivy filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: evaluation-service-main
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Docker build
        run: |
          docker build \
            -t $ECR_REGISTRY/evaluation-service:${{ github.sha }} \
            .

      - name: Container scan - Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/evaluation-service:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish-and-gitops:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: security-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          docker build \
            -t $ECR_REGISTRY/evaluation-service:${{ github.sha }} \
            evaluation-service-main

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          docker push \
            $ECR_REGISTRY/evaluation-service:${{ github.sha }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          persist-credentials: false

      - name: Update GitOps image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("gitops/apps/evaluation-service/deployment.yaml")
          text = path.read_text()

          image_tag = os.environ["IMAGE_TAG"]

          pattern = (
              r"(image:\s+"
              r"523694734848\.dkr\.ecr\.us-east-1\.amazonaws\.com/"
              r"evaluation-service:)[^\s]+"
          )

          replacement = rf"\g<1>{image_tag}"

          updated, count = re.subn(pattern, replacement, text)

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one evaluation-service image, found {count}"
              )

          path.write_text(updated)
          PY

      - name: Commit and push GitOps
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/evaluation-service/deployment.yaml

          git commit \
            -m "chore(evaluation-service): deploy ${IMAGE_TAG::7}" \
            || echo "No changes to commit"

          git remote set-url origin \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPOSITORY}.git"

          git push origin main
